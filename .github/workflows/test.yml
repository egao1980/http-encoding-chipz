name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: http-encoding-chipz-test-${{ github.ref }}
  cancel-in-progress: true

env:
  SBCL_VERSION: 2.4.11
  ROSWELL_VERSION: "26.02.116"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout http-protocol sibling
        uses: actions/checkout@v4
        with:
          repository: egao1980/http-protocol
          path: http-protocol

      - name: Install Roswell (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -sL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Install Roswell (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sL "https://github.com/roswell/roswell/releases/download/v${ROSWELL_VERSION}/roswell_${ROSWELL_VERSION}_amd64.zip" \
            -o /tmp/roswell.zip
          rm -rf /c/roswell && mkdir -p /c/roswell
          unzip -qo /tmp/roswell.zip -d /c/roswell
          echo "/c/roswell/roswell" >> "$GITHUB_PATH"
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Install SBCL
        shell: bash
        run: |
          ros install "sbcl-bin/$SBCL_VERSION"
          ros use "sbcl-bin/$SBCL_VERSION"

      - name: Test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ros install qlot
          mkdir -p /tmp/workspace
          cp -a "$GITHUB_WORKSPACE" /tmp/workspace/http-encoding-chipz
          cp -a "$GITHUB_WORKSPACE/http-protocol" /tmp/workspace/http-protocol
          cd /tmp/workspace/http-encoding-chipz
          qlot install
          qlot exec ros -S . -e '(asdf:test-system "http-encoding-chipz")'

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ros install rove chipz salza2 trivial-gray-streams
          export CL_SOURCE_REGISTRY="$(pwd)//:$(pwd)/http-protocol//:"
          ros -S . -e '(asdf:test-system "http-encoding-chipz")' -q
